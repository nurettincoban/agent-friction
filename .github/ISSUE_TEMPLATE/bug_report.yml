name: Bug report
description: Something crashed or produced a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output. Please redact anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: agent-friction version
      placeholder: agent-friction --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version, and agent (e.g. Claude Code 2.x)
