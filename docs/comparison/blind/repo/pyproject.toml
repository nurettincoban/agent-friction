[project]
name = "tidewater"
version = "0.9.2"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
tidewater = "tidewater.cli:main"

[tool.pytest.ini_options]
markers = ["integration: needs TimescaleDB (make db-up)"]

[tool.ruff]
line-length = 100
