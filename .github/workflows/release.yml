name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run mypy && uv run pytest
      - name: Tag matches package version
        run: test "v$(uv run python -c 'import agent_friction; print(agent_friction.__version__)')" = "$GITHUB_REF_NAME"

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no API token stored in the repo
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Smoke-test the built wheel and sdist
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv venv --clear /tmp/smoke
            uv pip install --python /tmp/smoke/bin/python "$dist"
            /tmp/smoke/bin/agent-friction --version
            /tmp/smoke/bin/agent-friction scan tests/fixtures/shopfront --transcripts tests/fixtures/transcripts --repo-alias /home/dev/shopfront --no-git > /dev/null
          done
      - run: uv publish --trusted-publishing always
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
