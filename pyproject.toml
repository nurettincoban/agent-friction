[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-friction"
dynamic = ["version"]
description = "Map where coding agents lose time, make mistakes, and need human correction in your codebase, with the evidence to decide what to fix."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nurettin Coban" }]
keywords = ["ai", "coding-agents", "claude-code", "developer-experience", "observability", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nurettincoban/agent-friction"
Documentation = "https://nurettincoban.github.io/agent-friction/"
Issues = "https://github.com/nurettincoban/agent-friction/issues"
Changelog = "https://github.com/nurettincoban/agent-friction/blob/main/CHANGELOG.md"

[project.scripts]
agent-friction = "agent_friction.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.version]
path = "src/agent_friction/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "src", "tests", "docs", "examples", "scripts", "plugin", ".claude-plugin",
  "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md",
  "AGENTS.md", "Makefile", "uv.lock",
]
exclude = ["docs/assets", "docs/comparison/blind", "docs/comparison/blind2", "docs/comparison/blind3", "docs/comparison/blind4"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_friction"]

# `agent-friction demo` scans these; a source checkout reads them from tests/fixtures.
[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/shopfront" = "agent_friction/_demo/shopfront"
"tests/fixtures/transcripts" = "agent_friction/_demo/transcripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/comparison/blind", "docs/comparison/blind2", "docs/comparison/blind3", "docs/comparison/blind4"]  # a held-out dataset, kept exactly as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
# Typographic symbols (×, →, …) in user-facing strings are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agent_friction"]

[tool.coverage.run]
source = ["agent_friction"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
